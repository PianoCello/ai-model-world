name: 同步上游代码

on:
  schedule:
    # 每天北京时间 11:10 检查一次原作者仓库。
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取 Fork 完整历史
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 合并原作者主分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/liyupi/ai-model-world.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已经是最新版本"
            exit 0
          fi

          # data/*.json 是两边各自生成的快照；.github/workflows 是 Fork 自己的
          # 部署与同步配置。这两处都不从上游复制。如果上游只有这些变化，直接结束。
          if git diff --quiet HEAD...upstream/main -- . \
            ':(exclude,glob)data/*.json' \
            ':(exclude).github/workflows'; then
            echo "上游只有自动数据或工作流变化，跳过同步"
            exit 0
          fi

          before_merge=$(git rev-parse HEAD)

          # 先尝试正常合并。若冲突仅来自 Fork 自主管理的数据或工作流，则稍后
          # 统一恢复 Fork 版本；其他代码、文档或配置冲突仍然需要人工处理。
          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            external_conflicts=$(printf '%s\n' "$conflicts" \
              | grep -Ev '^(data/[^/]+\.json|\.github/workflows/)' || true)

            if [ -z "$conflicts" ] || [ -n "$external_conflicts" ]; then
              echo "::error::上游代码存在需要人工处理的冲突"
              printf '%s\n' "$conflicts"
              git merge --abort || true
              exit 1
            fi

            echo "冲突仅涉及 Fork 自主管理的数据或工作流，保留 Fork 版本"
          fi

          # 即使这些文件能被 Git 自动合并，也统一恢复为合并前的 Fork 版本。
          # 这也会删除上游新增的工作流，避免 GITHUB_TOKEN 因无 workflows 权限
          # 而拒绝整个代码同步 push。
          git restore --source="$before_merge" --staged --worktree -- \
            ':(glob)data/*.json' \
            .github/workflows

          git commit --no-edit
          git push origin main

      - name: 合并失败时创建或更新 Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '上游代码自动同步失败';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `自动合并 \`liyupi/ai-model-world\` 的 \`main\` 分支失败，通常是 Fork 的自定义配置与上游修改发生冲突。\n\n运行记录：${runUrl}\n\n自动化没有强行覆盖任何文件，请手动解决冲突后关闭此 Issue。`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
